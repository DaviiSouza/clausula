# docker compose up --build  →  app: http://localhost:8501, API docs: http://localhost:8000/docs
services:
  api:
    build: .
    image: clausula:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      - CLAUSULA_BACKEND=${CLAUSULA_BACKEND:-legal-bert}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    image: clausula:latest
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "8501:8501"
    environment:
      - CLAUSULA_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
